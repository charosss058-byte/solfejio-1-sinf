
<script>

const tg = window.Telegram.WebApp;

tg.expand();

const user = tg.initDataUnsafe?.user;


/* =========================================
   TELEGRAM USER
========================================= */

if (user) {
    console.log("Telegram User ID:", user.id);
    console.log("Telegram Name:", user.first_name);
}


/* =========================================
   LICENSE / ACCESS TEKSHIRUVI
========================================= */

async function checkLicense() {

    try {

        if (!tg.initData) {

            console.error("Telegram initData mavjud emas.");

            return false;
        }

        const response = await fetch(
            "https://solfejio-license.charosss058.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    initData: tg.initData
                })
            }
        );

        if (!response.ok) {

            console.error(
                "License server xatosi:",
                response.status
            );

            return false;
        }

        const result = await response.json();

        console.log("License server javobi:", result);

        return (
            result.ok === true &&
            result.access === true
        );

    } catch (error) {

        console.error(
            "License tekshirishda xato:",
            error
        );

        return false;
    }
}


/* =========================================
   SAVOLLAR
========================================= */

const questions = [

    {
        q: "Скрипка калитида 1-чизиқда қайси нота жойлашган?",
        options: ["До", "Ре", "Ми", "Фа"],
        answer: "Ми"
    },

    {
        q: "Биринчи қўшимча чизиқда қайси нота жойлашган?",
        options: ["До", "Ми", "Соль", "Ля"],
        answer: "До"
    },

    {
        q: "‘Forte’ (Форте) атамаси нимани англатади?",
        options: [
            "Секин",
            "Баланд / Жарангдор",
            "Тез",
            "Оҳиста"
        ],
        answer: "Баланд / Жарангдор"
    },

    {
        q: "‘Piano’ (Пиано) мусиқий атамаси маъноси нима?",
        options: [
            "Паст / Оҳиста",
            "Тез",
            "Жуда баланд",
            "Шошмасдан"
        ],
        answer: "Паст / Оҳиста"
    },

    {
        q: "Мусиқада нечта асосий нота бор?",
        options: [
            "5 та",
            "6 та",
            "7 та",
            "8 та"
        ],
        answer: "7 та"
    }

];


/* =========================================
   O'YIN O'ZGARUVCHILARI
========================================= */

let currentQ = 0;
let score = 0;
let answerLocked = false;

document.getElementById("total").innerText =
    questions.length;


/* =========================================
   TO'G'RI JAVOB OVOZI
========================================= */

function playCorrectSound() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audioContext =
        new AudioContext();

    const oscillator =
        audioContext.createOscillator();

    const gainNode =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        660,
        audioContext.currentTime
    );

    oscillator.frequency.setValueAtTime(
        880,
        audioContext.currentTime + 0.12
    );

    gainNode.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.4
    );

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.4
    );
}


/* =========================================
   NOTO'G'RI JAVOB OVOZI
========================================= */

function playWrongSound() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audioContext =
        new AudioContext();

    const oscillator =
        audioContext.createOscillator();

    const gainNode =
        audioContext.createGain();

    oscillator.type = "sawtooth";

    oscillator.frequency.setValueAtTime(
        220,
        audioContext.currentTime
    );

    gainNode.gain.setValueAtTime(
        0.12,
        audioContext.currentTime
    );

    gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.3
    );

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.3
    );
}


/* =========================================
   SAVOLNI YUKLASH
========================================= */

function loadQuestion() {

    answerLocked = false;

    const question =
        questions[currentQ];

    document.getElementById("question").innerText =
        question.q;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    question.options.forEach(function(option) {

        const button =
            document.createElement("button");

        button.className = "btn-opt";

        button.innerText = option;

        button.onclick = function() {

            checkAnswer(
                option,
                button
            );

        };

        options.appendChild(button);

    });

    document.getElementById("result-msg").innerText =
        "";

    document.getElementById("score").innerText =
        score;
}


/* =========================================
   JAVOBNI TEKSHIRISH
========================================= */

function checkAnswer(
    selectedAnswer,
    clickedButton
) {

    if (answerLocked) return;

    answerLocked = true;

    const correctAnswer =
        questions[currentQ].answer;

    const buttons =
        document.querySelectorAll(".btn-opt");

    buttons.forEach(function(button) {

        button.disabled = true;

    });


    if (selectedAnswer === correctAnswer) {

        score++;

        document.getElementById(
            "result-msg"
        ).innerText =
            "✅ To'g'ri javob!";

        playCorrectSound();

    } else {

        document.getElementById(
            "result-msg"
        ).innerText =
            "❌ Noto'g'ri javob! To'g'ri javob: " +
            correctAnswer;

        playWrongSound();
    }


    document.getElementById("score").innerText =
        score;


    setTimeout(function() {

        currentQ++;

        if (currentQ < questions.length) {

            loadQuestion();

        } else {

            finishGame();

        }

    }, 1200);
}


/* =========================================
   O'YIN TUGASHI
========================================= */

function finishGame() {

    const questionBox =
        document.getElementById("question");

    const options =
        document.getElementById("options");

    const result =
        document.getElementById("result-msg");

    questionBox.innerText =
        "🎉 O'yin tugadi!";

    options.innerHTML = "";

    result.innerText =
        "Siz " +
        questions.length +
        " ta savoldan " +
        score +
        " tasiga to'g'ri javob berdingiz.";

    result.style.color = "#28a745";

}


/* =========================================
   O'YINNI BOSHLASH
========================================= */

async function startGame() {

    const loadingCard =
        document.getElementById(
            "loading-card"
        );

    const gameCard =
        document.getElementById(
            "game-card"
        );

    const accessDenied =
        document.getElementById(
            "access-denied"
        );


    loadingCard.classList.remove("hidden");

    gameCard.classList.add("hidden");

    accessDenied.classList.add("hidden");


    const hasAccess =
        await checkLicense();


    if (hasAccess) {

        console.log(
            "ACCESS BERILDI. O'YIN OCHILMOQDA..."
        );

        loadingCard.classList.add("hidden");

        gameCard.classList.remove("hidden");

        loadQuestion();

    } else {

        console.log(
            "ACCESS YO'Q. KIRISH CHEKLANGAN."
        );

        loadingCard.classList.add("hidden");

        accessDenied.classList.remove("hidden");

    }

}


/* =========================================
   START
========================================= */

startGame();

</script>

</body>
</html>
